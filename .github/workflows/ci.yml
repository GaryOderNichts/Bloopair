name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-binary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: build binary
      run: |
        docker build -t bloopair-builder .
        docker run --rm -v "$GITHUB_WORKSPACE:/project" bloopair-builder sh -lc \
          'git config --global --add safe.directory /project && make -C tests && make dist'
    - uses: actions/upload-artifact@v7
      with:
       name: Bloopair_nightly
       path: dist/*
